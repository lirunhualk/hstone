  - generic [ref=f14e148]: 可按住并拖动。商店随从拖到手牌区域购买；普通手牌拖到战场插位线上场；磁力随从拖到标有“可吸附”的友方随从进行吸附，拖到插位线则普通上场；场上随从可拖动换位，或拖到鲍勃的酒馆出售。也可点击卡牌后使用详情面板中的按钮。
  - generic [ref=f14e149]: 这是当前磁力牌的合法目标。点击或按回车键即可完成吸附；按 Escape 键取消选择。
  - generic [ref=f14e150]: 这是当前鲜血宝石的合法目标。点击或按回车键即可使用；按 Escape 键取消选择。
  - generic [ref=f14e151]: 这是当前酒馆法术的合法目标。点击或按回车键即可施放；按 Escape 键取消选择。
  - generic [ref=f14e152]: 这是当前所选法术的合法目标。点击或按回车键即可施放；按 Escape 键取消选择。
  - generic [ref=f14e153]: 购买随从需要 3枚金币；饰品可能把随从或酒馆法术的费用改为生命值。生命购买必须保留至少1点生命，且购买时手牌必须未满；也可点击卡牌后使用详情面板中的购买按钮。
